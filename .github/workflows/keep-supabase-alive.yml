name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 */3 * *'  # every 3 days at noon UTC
  workflow_dispatch:          # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase directly
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          pip install psycopg2-binary -q
          python -c "
          import psycopg2, os, socket, urllib.parse
          url = os.environ['DIRECT_DATABASE_URL']
          p = urllib.parse.urlparse(url)
          ipv4 = socket.getaddrinfo(p.hostname, p.port or 5432, socket.AF_INET)[0][4][0]
          conn = psycopg2.connect(host=p.hostname, hostaddr=ipv4, port=p.port or 5432,
                                  dbname=p.path.lstrip('/'), user=p.username,
                                  password=p.password, sslmode='require')
          conn.cursor().execute('SELECT 1')
          conn.close()
          print('Supabase ping ok')
          "
